[versions]
# --- Build tooling ---
agp = "9.4.0"
kotlin = "2.4.20"
ksp = "2.3.12"

# --- AndroidX core ---
coreKtx = "1.19.0"
lifecycle = "2.11.0"
activityCompose = "1.13.0"
# Only for AppCompatDelegate's per-app-language API (LanguageScreen) — MainActivity stays a
# plain FragmentActivity, not AppCompatActivity; the delegate works process-wide regardless.
appcompat = "1.8.0"

# --- Compose ---
composeBom = "2026.08.00"
navigationCompose = "2.10.0"
kotlinxSerialization = "1.11.0"

# --- Hilt (DI) ---
hilt = "2.60.1"
hiltNavigationCompose = "1.4.0"
hiltWork = "1.4.0"

# --- Room (local DB) ---
room = "2.8.4"

# --- DataStore ---
datastore = "1.2.1"

# --- WorkManager ---
workManager = "2.11.2"

# --- CameraX ---
camerax = "1.6.2"

# --- ML Kit (on-device) ---
mlkitDocumentScanner = "16.0.0"
mlkitTextRecognition = "16.0.1"
# Unbundled (Play-services-delivered, download-on-demand) script packs — see the chat notes
# on why these are NOT the bundled `com.google.mlkit:text-recognition-*` artifacts.
mlkitTextRecognitionScripts = "16.0.1"

# --- Billing ---
# 9.1.0. Play requires version 8 or later for new apps and updates as of 31 Aug 2026, so 7.1.1
# could no longer be submitted at all. Went to 9 rather than stopping at 8 because 8 carries the
# breaking API removals and 9 is comparatively cheap on top of it.
#
# Nothing v8 or v9 removed was in use here — no SkuDetails, no queryPurchaseHistoryAsync, no
# subscriptions or proration, no alternative billing, and enablePendingPurchases was already being
# passed a PendingPurchasesParams. The one signature change that does land in v8
# (ProductDetailsResponseListener now receives a QueryProductDetailsResult rather than a
# List<ProductDetails>) is absorbed inside the billing-ktx wrapper, which still hands callers a
# ProductDetailsResult.
#
# billing-ktx is NOT discontinued, despite what is easy to conclude from the migration guides: it
# is published in lockstep with the main artifact through 9.1.0, and queryProductDetails,
# queryPurchasesAsync and acknowledgePurchase all survive with unchanged signatures. Verified
# against the published .aar, not the docs.
#
# Library minSdk is 23 (ours is 24) and it wants compileSdk 35+ (ours is 36). v9's blocked-Play-
# Store detection needs androidx.core 1.9+; coreKtx above is well past that.
billing = "9.1.0"

# --- Biometric (app lock) ---
biometric = "1.1.0"

# --- Image loading ---
coil = "2.7.0"

# --- PDF editing ---
# Stamps signatures and watermarks onto a stored PDF in place, instead of re-rendering every
# page -- see PdfMarkStamper. BouncyCastle is excluded where it is declared.
pdfboxAndroid = "2.0.27.0"

# --- Testing ---
junit = "4.13.2"
androidxTestExtJunit = "1.3.0"
espresso = "3.7.0"
kotlinxCoroutinesTest = "1.11.0"
# Real org.json for JVM unit tests. android.jar's own org.json is a stub that throws "Stub!" on
# every call, and Purchase's public (String originalJson, String signature) constructor parses its
# JSON eagerly — so without this, a test cannot construct the very type the billing classification
# logic is about. Test scope only; it is never packaged.
orgJson = "20260814"
# Inline mock maker is the default since 5.0 — needed to stand in for the Android framework
# types (Context, Bitmap) a few use case constructors take, without pulling in Robolectric.
# Used sparingly: everything that's a domain-owned interface stays a hand-written fake, per the
# existing test convention (see SearchViewModelTest) — this is only for the two Android classes
# hand-written fakes can't stand in for.
mockito = "5.23.0"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }

androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
androidx-compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-compose-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }

androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigationCompose" }
kotlinx-serialization-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-core", version.ref = "kotlinxSerialization" }

google-hilt-android = { group = "com.google.dagger", name = "hilt-android", version.ref = "hilt" }
google-hilt-compiler = { group = "com.google.dagger", name = "hilt-compiler", version.ref = "hilt" }
androidx-hilt-navigation-compose = { group = "androidx.hilt", name = "hilt-navigation-compose", version.ref = "hiltNavigationCompose" }
# NOTE: this is the processor @HiltViewModel (since the scanning-flow prompt) and @HiltWorker
# (new, for background OCR) both need — distinct from com.google.dagger:hilt-compiler above.
# It was missing before now; see the chat reply.
androidx-hilt-compiler = { group = "androidx.hilt", name = "hilt-compiler", version.ref = "hiltWork" }
androidx-hilt-work = { group = "androidx.hilt", name = "hilt-work", version.ref = "hiltWork" }

androidx-room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
androidx-room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
androidx-room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }
# Room's own MigrationTestHelper — replays the exported schema JSON in app/schemas so each
# Migration is verified against the real pair of snapshots it bridges. See MigrationTest.
androidx-room-testing = { group = "androidx.room", name = "room-testing", version.ref = "room" }

androidx-datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }

androidx-work-runtime-ktx = { group = "androidx.work", name = "work-runtime-ktx", version.ref = "workManager" }

androidx-camera-core = { group = "androidx.camera", name = "camera-core", version.ref = "camerax" }
androidx-camera-camera2 = { group = "androidx.camera", name = "camera-camera2", version.ref = "camerax" }
androidx-camera-lifecycle = { group = "androidx.camera", name = "camera-lifecycle", version.ref = "camerax" }
androidx-camera-view = { group = "androidx.camera", name = "camera-view", version.ref = "camerax" }

google-mlkit-document-scanner = { group = "com.google.android.gms", name = "play-services-mlkit-document-scanner", version.ref = "mlkitDocumentScanner" }
google-mlkit-text-recognition = { group = "com.google.mlkit", name = "text-recognition", version.ref = "mlkitTextRecognition" }
google-mlkit-text-recognition-chinese = { group = "com.google.android.gms", name = "play-services-mlkit-text-recognition-chinese", version.ref = "mlkitTextRecognitionScripts" }
google-mlkit-text-recognition-devanagari = { group = "com.google.android.gms", name = "play-services-mlkit-text-recognition-devanagari", version.ref = "mlkitTextRecognitionScripts" }
google-mlkit-text-recognition-japanese = { group = "com.google.android.gms", name = "play-services-mlkit-text-recognition-japanese", version.ref = "mlkitTextRecognitionScripts" }
google-mlkit-text-recognition-korean = { group = "com.google.android.gms", name = "play-services-mlkit-text-recognition-korean", version.ref = "mlkitTextRecognitionScripts" }

google-billing = { group = "com.android.billingclient", name = "billing", version.ref = "billing" }

androidx-biometric = { group = "androidx.biometric", name = "biometric", version.ref = "biometric" }

coil-compose = { group = "io.coil-kt", name = "coil-compose", version.ref = "coil" }
pdfbox-android = { group = "com.tom-roush", name = "pdfbox-android", version.ref = "pdfboxAndroid" }

junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-test-ext-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidxTestExtJunit" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espresso" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "kotlinxCoroutinesTest" }
mockito-core = { group = "org.mockito", name = "mockito-core", version.ref = "mockito" }
org-json = { group = "org.json", name = "json", version.ref = "orgJson" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
# Powers Navigation Compose's type-safe (@Serializable route) API — see Destination.kt.
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
